# Annual hillslope sediment delivery under climatological R, not gauged sediment load.
schema_version: 1
comparison_config: config/landcover_comparison.yaml
cache: project/sediment
outputs: experiments/sediment
erosivity: data/Soil/R-factor1991-2020.tif
erodibility: data/Soil/epic-k-factor.tif
support_practice: data/LCLU/P_300.tif
crop_c: data/LCLU/nature_table_2_cropland_c_factor.csv
noncrop_c: data/LCLU/nature_table_3_non_cropland_c_factor.csv
observations: data/Hydrology/输沙量2011-2024.csv
observation_unit: 100million_t/yr
watersheds: project/repairs/closed_routing_v3/watersheds.gpkg
zone_station: project/repairs/closed_routing_v3/zone_station.csv
model:
  flow_dir_algorithm: mfd
  threshold_flow_accumulation: 1000
  k_param: 2.0
  ic_0_param: 0.5
  sdr_max: 0.8
  l_max: 122.0
  n_workers: 2
policy:
  k_multiplier: 1.0
  noncrop_range_position: 0.5
  p_missing: no_practice_p1
  k_gap_max_distance_m: 10000
  # All values are declared priors; observations are never used for fitting.
  r_period: 1991-2020
  r_units: MJ_mm_ha-1_h-1_yr-1
  k_units: t_ha_h_ha-1_MJ-1_mm-1
# Codes apply ONLY to vegetation_model_20261016_161145.csv; validate label on load.
# crop/noncrop numbers refer to the n column of the supplied source tables.
