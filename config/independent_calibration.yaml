# Primary experiment: four representations, independently calibrated.
schema_version: 1
baseline_config: config/landcover_comparison.yaml
sample_recipe: experiments/shared_detail_calibration/20261011T092823_836045Z/experiment.json
registry: config/shared_biophysical.yaml
output_root: experiments/independent_calibration
products: [fine, fine_level1, copernicus, worldcover]
candidates: [reach7, class, class_storage]
folds: [[2013, 2014, 2015], [2016, 2017], [2019, 2020, 2021]]
calibration_budget_per_zone: 8192
verification_budget_per_zone: 32768
selection: per_product_training_block_cv_relative_rmse
selection_tie_break: fewer_parameters
validation_years: [2022, 2023, 2024]
station_error: absolute_relative_error_percent
annual_total_error: root_mean_square_relative_station_error_percent
class_regularization: 0.005
max_nfev: 150
starts: 3
class_solver_scale: jac
class_solver_tolerance: 1.0e-7
nonconvergence: retain_diagnostics_exclude_candidate_if_any_cv_fold_fails
full_pixel_validation: true
cross_calibration: deferred_until_primary_accuracy_comparison
