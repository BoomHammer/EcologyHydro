# One parameter library for all products. No product/region/year-specific overrides.
# Screening priors, NOT a locally validated parameter set. See the evidence report.
schema_version: 1
status: evidence_audited_screening_priors
reviewed_on: '2026-10-19'
sources:
  INVEST: https://storage.googleapis.com/releases.naturalcapitalproject.org/invest-userguide/latest/en/annual_water_yield.html
  FAO_KC: https://www.fao.org/4/X0490E/x0490e0b.htm
  FAO_ROOT: https://www.fao.org/4/x0490e/x0490e0e.htm
  FAO_DUAL: https://www.fao.org/4/X0490E/x0490e0c.htm
  JACKSON: https://jacksonlab.stanford.edu/sites/g/files/sbiybj20871/files/media/file/oecol96c.pdf
  YANG: https://onlinelibrary.wiley.com/doi/10.1111/j.1654-1103.2009.05566.x
  WORLDCOVER: https://esa-worldcover.s3.eu-central-1.amazonaws.com/v200/2021/docs/WorldCover_PUM_V2.0.pdf
  COPERNICUS: https://land.copernicus.eu/en/technical-library/global-dynamic-land-cover-product-user-manual-v3.0/@@download/file
policy:
  equivalent_profiles: exactly_identical_across_products
  child_defaults: inherit_parent_unless_field_has_explicit_evidence
  calibration: one_shared_Z_vector_Kc_multiplier_and_L_for_all_products
  monthly_kc: no_product_specific_calendar_in_this_control
  regional_overrides: forbidden
  unsupported_detail: inherit_parent_and_record_limitation
  annual_kc: nominal_values_are_hypotheses_except_conditional_water_anchor
  kc_ranges: analyst_sensitivity_envelopes_not_confidence_intervals
  mixed_classes: use_declared_parent_prior_not_unobserved_subclass_fractions
  validation: no_selection_using_2022_2024
profiles:
  crop:
    lulc_veg: 1
    kc: 0.70
    kc_range: [0.45, 0.95]
    kc_evidence: Annual mixed-crop hypothesis; FAO stage values do not identify annual Kc.
    kc_sources: [FAO_KC]
    root_depth: 1400
    root_evidence: Cereal effective-depth proxy; FAO wheat/maize ranges differ; mixture unknown.
    root_sources: [FAO_ROOT]
  tree:
    lulc_veg: 1
    kc: 0.775
    kc_range: [0.55, 1.00]
    kc_evidence: Annual generic-tree hypothesis retained for the control, not a measured mean.
    kc_sources: []
    beta: 0.970
    root_evidence: Global temperate/tropical tree life-form d95 transfer; not local forest depth.
    root_sources: [JACKSON]
  shrub:
    lulc_veg: 1
    kc: 0.60
    kc_range: [0.35, 0.85]
    kc_evidence: Annual generic-shrub hypothesis; species/phenology unresolved.
    kc_sources: []
    beta: 0.978
    root_evidence: Global shrub life-form d95, replacing an unjustified sclerophyllous biome proxy.
    root_sources: [JACKSON]
  grass:
    lulc_veg: 1
    kc: 0.60
    kc_range: [0.35, 0.85]
    kc_evidence: Annual generic-grass hypothesis; no class-specific annual measurements.
    kc_sources: []
    beta: 0.952
    root_evidence: Global grass life-form d95; broad class is not exclusively temperate steppe.
    root_sources: [JACKSON]
  desert_vegetation:
    lulc_veg: 1
    kc: 0.30
    kc_range: [0.15, 0.45]
    kc_evidence: Annual desert-vegetation hypothesis; canopy cover still requires verification.
    kc_sources: []
    beta: 0.975
    root_evidence: Desert vegetation biome d95; never assign this root to exposed sand or rock.
    root_sources: [JACKSON]
  bare:
    lulc_veg: 0
    kc: 0.15
    kc_range: [0.05, 0.50]
    kc_evidence: Unresolved annual evaporation; retained nominal control, not FAO total bare-soil Kc.
    kc_sources: [FAO_DUAL]
    root_depth: 1
    root_evidence: Ignored sentinel for the nonvegetated branch, not a physical root.
    root_sources: [INVEST]
  built:
    lulc_veg: 0
    kc: 0.30
    kc_range: [0.10, 0.50]
    kc_evidence: Annual urban evaporation hypothesis; excludes municipal consumption.
    kc_sources: []
    root_depth: 1
    root_evidence: Ignored sentinel.
    root_sources: [INVEST]
  snow:
    lulc_veg: 0
    kc: 0.05
    kc_range: [0.02, 0.10]
    kc_evidence: Sublimation placeholder; AWY lacks snow/glacier storage and melt dynamics.
    kc_sources: []
    root_depth: 1
    root_evidence: Ignored sentinel.
    root_sources: [INVEST]
  water:
    lulc_veg: 0
    kc: 1.05
    kc_range: [0.85, 1.25]
    kc_evidence: FAO shallow-water anchor; deep reservoirs/heat storage require separate evidence.
    kc_sources: [FAO_KC]
    root_depth: 1
    root_evidence: Ignored sentinel.
    root_sources: [INVEST]
  wetland:
    lulc_veg: 0
    kc: 0.90
    kc_range: [0.60, 1.20]
    kc_evidence: Annual hypothesis; FAO seasonal wetland values are not an annual local measurement.
    kc_sources: [FAO_KC]
    root_depth: 1
    root_evidence: Ignored sentinel; AWY explicitly uses nonvegetated branch for wetlands.
    root_sources: [INVEST]
  moss:
    parent: grass
    limitation: Grass fallback only; moss/lichen physiology not represented; do not call it evidence-based.
  rice:
    parent: crop
    root_depth: 750
    root_evidence: Midpoint of FAO rice effective-root range 0.5-1.0 m; seasonal not annual measurement.
    root_sources: [FAO_ROOT]
    limitation: Annual Kc inherited; flooding/irrigation supply not inferred from class name.
  deciduous_tree:
    parent: tree
    beta: 0.966
    root_evidence: Temperate deciduous forest biome d95 transfer; not species-specific evidence.
    root_sources: [JACKSON]
  evergreen_conifer:
    parent: tree
    beta: 0.976
    root_evidence: Temperate conifer biome d95 transfer; local species/soil constraints remain.
    root_sources: [JACKSON]
  alpine_meadow:
    parent: grass
    root_depth: 300
    root_evidence: Tibetan meadow 96 percent root biomass in top 300 mm; approximate d95 transfer.
    root_sources: [YANG]
  alpine_steppe:
    parent: grass
    limitation: 86 percent in top 300 mm does not identify d95; discard earlier single-point exponential extrapolation.
  temperate_steppe:
    parent: grass
    beta: 0.943
    root_evidence: Temperate grassland biome d95 transfer.
    root_sources: [JACKSON]
  deciduous_conifer:
    parent: tree
    limitation: No separate local rooting or annual phenology evidence; inherit tree.
  open_tree:
    parent: tree
    limitation: Open canopy alone does not justify invented shorter roots or a different annual Kc.
  orchard:
    parent: tree
    limitation: Species, ground cover and irrigation unknown; no invented orchard-specific values.
  shrub_garden:
    parent: shrub
    limitation: Species and management unknown; inherit shrub.
  greenhouse:
    parent: crop
    limitation: Crop fallback only; roofs/irrigation are structural uncertainty requiring area audit.
  celtuce:
    parent: crop
    root_depth: 400
    root_evidence: FAO lettuce effective-root range midpoint; celtuce-specific depth unavailable.
    root_sources: [FAO_ROOT]
    limitation: Lettuce proxy; annual Kc remains the generic crop hypothesis without a local calendar.
  chili:
    parent: crop
    root_depth: 750
    root_evidence: FAO sweet-pepper effective-root range midpoint.
    root_sources: [FAO_ROOT]
    limitation: Pepper proxy; annual Kc remains the generic crop hypothesis without a local calendar.
  cotton:
    parent: crop
    root_depth: 1350
    root_evidence: Midpoint of the FAO cotton effective-root range 1.0-1.7 m.
    root_sources: [FAO_ROOT]
  millet:
    parent: crop
    root_depth: 1500
    root_evidence: Midpoint of the FAO millet effective-root range 1.0-2.0 m.
    root_sources: [FAO_ROOT]
  peanut:
    parent: crop
    root_depth: 750
    root_evidence: Midpoint of the FAO groundnut effective-root range 0.5-1.0 m.
    root_sources: [FAO_ROOT]
  potato:
    parent: crop
    root_depth: 500
    root_evidence: Midpoint of the FAO potato effective-root range 0.4-0.6 m.
    root_sources: [FAO_ROOT]
  rapeseed:
    parent: crop
    root_depth: 1250
    root_evidence: Midpoint of the FAO rapeseed effective-root range 1.0-1.5 m.
    root_sources: [FAO_ROOT]
  sorghum:
    parent: crop
    root_depth: 1500
    root_evidence: Midpoint of the FAO grain-sorghum effective-root range 1.0-2.0 m.
    root_sources: [FAO_ROOT]
  soybean:
    parent: crop
    root_depth: 950
    root_evidence: Midpoint of the FAO soybean effective-root range 0.6-1.3 m.
    root_sources: [FAO_ROOT]
  sunflower:
    parent: crop
    root_depth: 1150
    root_evidence: Midpoint of the FAO sunflower effective-root range 0.8-1.5 m.
    root_sources: [FAO_ROOT]
  sweet_potato:
    parent: crop
    root_depth: 1250
    root_evidence: Midpoint of the FAO sweet-potato effective-root range 1.0-1.5 m.
    root_sources: [FAO_ROOT]
  tomato:
    parent: crop
    root_depth: 1100
    root_evidence: Midpoint of the FAO tomato effective-root range 0.7-1.5 m.
    root_sources: [FAO_ROOT]
  watermelon:
    parent: crop
    root_depth: 1150
    root_evidence: Midpoint of the FAO watermelon effective-root range 0.8-1.5 m.
    root_sources: [FAO_ROOT]
  maize:
    parent: crop
    root_depth: 1350
    root_evidence: Midpoint of the FAO field-maize effective-root range 1.0-1.7 m.
    root_sources: [FAO_ROOT]
  wheat_maize_rotation:
    parent: crop
    limitation: Annual Kc is replaced by the documented PET-weighted monthly rotation scenario.
  urban_green:
    parent: tree
    limitation: Generic urban green space; retains the preceding map's arboreal-green proxy.
