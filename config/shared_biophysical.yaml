mapping_limitations:
  coarse_60: Less than or equal to 10 percent vegetation per product manuals; bare-dominant approximation, not measured zero vegetation. Do not assign homogeneous desert vegetation roots.
  fine_11: Desert vegetation cover fraction is unspecified; cannot equate automatically to coarse 60.
  fine_24: Updated 20261010 legend; residential land is impervious per user confirmation, uses shared built profile.
  fine_25: Updated urban tree green space; not impervious. Lake/reservoir/wetland shifted to 26/27/28.
  crop: Rotation information is real but its assumed annual Kc is not independently verified; isolate in a later seasonal control.
  forest: Copernicus also has forest subtypes; supported detail is available to every product whose legend resolves it.
