    veg: 1
    kc: [0.30, 0.55, 0.80]
    fraction_top_300mm: 0.86
    root_source: YANG2009
    kc_source: ASSUMED
    evidence: d95 extrapolated from one cumulative fraction using exponential profile; uncertain.
  grass:
