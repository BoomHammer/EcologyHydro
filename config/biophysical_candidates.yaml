# Values are candidate priors, NOT fitted or locally measured parameters.
# Arrays are [low, central, high]; bounds are scenario choices, not confidence intervals.
status: literature_informed_and_assumed_sensitivity_only
date: '2026-10-09'
sources:
  FAO_KC: https://www.fao.org/4/X0490E/x0490e0b.htm
  FAO_ROOT: https://www.fao.org/4/x0490e/x0490e0e.htm
  JACKSON1996: https://jacksonlab.stanford.edu/sites/g/files/sbiybj20871/files/media/file/oecol96c.pdf
  YANG2009: https://onlinelibrary.wiley.com/doi/10.1111/j.1654-1103.2009.05566.x
policy:
  kc: Annual effective coefficients below are assumptions informed by references; stage Kc is not annual Kc.
  roots: beta gives d95=10*log(0.05)/log(beta) mm; transferred biome values are not local observations.
  irrigation: Identical generic cereal parameters for irrigated/rainfed land; no invented irrigation supply.
  uncertainty: All low/high multipliers and envelopes are analyst assumptions, not literature confidence limits.
profiles:
  rice:
    veg: 1
    kc: [0.60, 0.85, 1.10]
    root_mm: [500, 750, 1000]
    root_source: FAO_ROOT
    kc_source: FAO_KC
    evidence: Root range for rice transferred; annual Kc assumed including off-season.
  cereal:
    veg: 1
    kc: [0.45, 0.70, 0.95]
    root_mm: [1000, 1400, 1800]
    root_source: FAO_ROOT
    kc_source: FAO_KC
    evidence: Wheat/maize root envelope and midpoint proxy; crop mix and annual phenology unknown.
  orchard:
    veg: 1
    kc: [0.45, 0.70, 0.95]
    root_mm: [500, 1000, 2000]
    root_source: ASSUMED
