    kc: [0.15, 0.30, 0.45]
    beta: 0.975
    root_source: JACKSON1996
    kc_source: ASSUMED
    evidence: Desert vegetation root proxy; bare/sparse mixed class is not homogeneous vegetation.
  bare:
    veg: 0
    kc: [0.05, 0.15, 0.25]
    root_mm: [1, 1, 1]
    root_source: NOT_USED
    kc_source: ASSUMED
    evidence: Nonvegetated evaporation hypothesis; substrate subclasses share values without evidence.
  built:
    veg: 0
    kc: [0.10, 0.30, 0.50]
    root_mm: [1, 1, 1]
    root_source: NOT_USED
    kc_source: ASSUMED
    evidence: Urban evaporation hypothesis; no municipal water demand included.
  water:
    veg: 0
    kc: [0.85, 1.05, 1.25]
    root_mm: [1, 1, 1]
    root_source: NOT_USED
    kc_source: FAO_KC
    evidence: Shallow-water reference anchor; reservoir depth/heat storage unresolved.
  wetland:
    veg: 0
    kc: [0.60, 0.90, 1.20]
    root_mm: [1, 1, 1]
    root_source: NOT_USED
    kc_source: FAO_KC
    evidence: Annual envelope assumed from seasonal wetland references; AWY nonvegetated branch.
  snow:
    veg: 0
    kc: [0.02, 0.05, 0.10]
    root_mm: [1, 1, 1]
    root_source: NOT_USED
    kc_source: ASSUMED
    evidence: Evaporation-only placeholder; no glacier or snow storage/melt dynamics.
