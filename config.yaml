# M0 工程配置；研究数据、测站和网格在 M1/M2 确定。
schema_version: 1
paths:
  climate: data/Climate
  dem: data/DEM
  lulc: data/LCLU
  soil: data/Soil
  hydrology: data/Hydrology
  cache: project/cache
  outputs: experiments
  logs: project/logs
study:
  # 用户已确认：目标年 Y 用前四年 Y-4 至 Y-1 校准，Y 年独立验证。
  # 当前仅有 2019—2023，故当前验证目标为 2023；滚动执行器尚未实现。
  # 测站 X/Y 为 CGCS2000 经度/纬度；下方 projected_crs 是待选的模型米制投影。
  # 当前使用观测 CSV 中的站名作为项目标识，非另行编造的官方站号。
  # 率定/评价按站点—年份筛选有效观测；缺失不补零，零/负径流标为异常待核查。
  station_ids:
    - 唐乃亥
    - 贵得
    - 兰州
    - 下河沿
    - 石嘴山
    - 头道拐
    - 龙门
    - 三门峡
    - 花园口
    - 高村
    - 利津
  calibration_years: [2019, 2020, 2021, 2022]
  validation_years: [2023]
  projected_crs: null
  resolution_m: null
inputs:
  precipitation: null
  reference_et: null
  root_restricting_depth: null
  pawc: null
  lulc: null
  watersheds: null
  biophysical_table: null
  versions: {}
model:
  z_parameter: null
resources:
  max_workers: 2
  threads_per_worker: 1
  memory_budget_gb: 24
  timeout_hours: 12
random_seed: 42
log_level: INFO
